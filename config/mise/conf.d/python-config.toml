[env]
PYTHON_CONFIGURE_OPTS = """ \
 --enable-shared \
 --enable-static-libpython-for-interpreter \
 --enable-optimizations \
 --enable-safety \
 --enable-experimental-jit=no \
 --enable-loadable-sqlite-extensions \
 --enable-ipv6 \
 --enable-epoll \
 --enable-big-digits=30 \
 --enable-test-modules \
 --with-pkg-config=check \
 --with-static-libpython \
 --with-lto=yes \
 --with-frame-pointers \
 --with-hash-algorithm=siphash24 \
 --with-system-expat \
 --with-system-libmpdec \
 --with-decimal-contextvar \
 --with-dbmliborder=ndbm:gdbm:bdb \
 --with-doc-strings \
 --with-mimalloc \
 --with-pymalloc \
 --with-pymalloc-hugepages \
 --with-c-locale-coercion \
 --with-valgrind \
 --with-dtrace \
 --with-readline=readline \
 --with-computed-gotos \
 --with-tail-call-interp \
 --with-remote-debug \
 --with-ensurepip=upgrade \
 --with-ssl-default-suites=python \
 --with-builtin-hashlib-hashes=md5,sha1,sha2,sha3,blake2
"""

[settings]
python.compile = true
python.uv_venv_auto = "create|source"
